version: '3.8'

services:
  # -----------------------------
  # 1. GATEWAY (Entry Point)
  # Port: 8000
  # -----------------------------
  gateway_service:
    build: ./gateway_service
    ports:
      - "8000:8000"
    environment:
      - SERVER_URL=http://server:8001
      - AI_SERVICE_URL=http://ai_service:8002
      - DATA_SERVICE_URL=http://data_service:8003
    depends_on:
      - server
      - ai_service
      - data_service

  # -----------------------------
  # 2. SERVER (Main Logic / App Server)
  # Port: 8001
  # -----------------------------
  server:
    build: ./server
    ports:
      - "8001:8001"
    environment:
      # Internal Service URLs
      - AI_SERVICE_URL=http://ai_service:8002
      - DATA_SERVICE_URL=http://data_service:8003
      # API Keys from .env
      - AMADEUS_API_KEY=${AMADEUS_API_KEY}
      - AMADEUS_SECRET=${AMADEUS_SECRET}
    depends_on:
      - data_service
      - ai_service

  # -----------------------------
  # 3. AI SERVICE (The Brain)
  # Port: 8002
  # -----------------------------
  ai_service:
    build: ./ai_service
    ports:
      - "8002:8002"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - HUGGINGFACE_API_KEY=${HF_TOKEN}
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    dns:
      - 8.8.8.8
      - 8.8.4.4

  # -----------------------------
  # 4. DATA SERVICE (Event Store + DB)
  # Port: 8003
  # -----------------------------
  data_service:
    build: ./data_service
    ports:
      - "8003:8003"

    # CRITICAL CONFIG: Google DNS for MongoDB Atlas Resolution
    # Required for resolving SRV records inside Docker
    dns:
      - 8.8.8.8
      - 8.8.4.4

    environment:
      # Connection string injected from .env
      - MONGODB_URI=${MONGODB_URI}
      - DATABASE_NAME=smart_travel_agent_db

  # -----------------------------
  # 5. OLLAMA (Local LLM Service)
  # Port: 11434
  # -----------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: smart_travel_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    entrypoint: [ "/bin/bash", "-c", "/bin/ollama serve & sleep 5 && ollama pull llama3.1 && wait" ]

# Ollama volume (saves Ollama models between restarts, so they won't have to redownload every run)
volumes:
  ollama_data:
