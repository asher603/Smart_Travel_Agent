services:
  # -----------------------------
  # 1. GATEWAY (Entry Point)
  # Port: 8000
  # -----------------------------
  gateway_service:
    build: ./gateway_service
    ports:
      - "8000:8000"
    environment:
      - SERVER_URL=http://server:8001
      - AI_SERVICE_URL=http://ai_service:8002
      # Internal Docker communication - use container's internal port (8003)
      - DATA_SERVICE_URL=http://data_service:8003
    depends_on:
      - server
      - ai_service
      - data_service

  # -----------------------------
  # 2. SERVER (Main Logic / App Server)
  # Port: 8001
  # -----------------------------
  server:
    build: ./server
    ports:
      - "8001:8001"
    environment:
      # Internal Service URLs
      - AI_SERVICE_URL=http://ai_service:8002
      - DATA_SERVICE_URL=http://data_service:8003
      # API Keys from .env
      - AMADEUS_API_KEY=${AMADEUS_API_KEY}
      - AMADEUS_SECRET=${AMADEUS_SECRET}
    depends_on:
      - data_service
      - ai_service

  # -----------------------------
  # 3. AI SERVICE (The Brain)
  # Port: 8002
  # -----------------------------
  ai_service:
    build: ./ai_service
    ports:
      - "8002:8002"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - HUGGINGFACE_API_KEY=${HF_TOKEN}
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    dns:
      - 8.8.8.8
      - 8.8.4.4

  # -----------------------------
  # MCP SERVER (Tools Service)
  # Port: 8003 (Host) -> 8000 (Container)
  # -----------------------------
  mcp-server:
    build: ./ai_service
    # Critical fix: Added --transport sse
    command: fastmcp run ai_service/mcp_server/server.py:mcp --transport sse --host 0.0.0.0 --port 8000
    volumes:
      - ./ai_service:/app/ai_service
      - ./server:/app/server
    environment:
      - PYTHONPATH=/app
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - HUGGINGFACE_API_KEY=${HF_TOKEN}
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "8003:8000"

  # -----------------------------
  # 4. DATA SERVICE (Event Store + DB)
  # Port: 8004 (Host) -> 8003 (Container)
  # -----------------------------
  data_service:
    build: ./data_service
    ports:
      # Moved to 8004 to free up 8003 for MCP
      - "8004:8003"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - DATABASE_NAME=smart_travel_agent_db

  # -----------------------------
  # 5. OLLAMA (Local LLM Service)
  # Port: 11434
  # -----------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: smart_travel_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    entrypoint: [ "/bin/bash", "-c", "/bin/ollama serve & sleep 5 && ollama pull llama3.1 && wait" ]

  # -----------------------------
  # 6. AUTOMATION (n8n)
  # Port: 5678
  # -----------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: smart_travel_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      # Connect to other services in the mesh
      - GENERIC_TIMEZONE=Asia/Jerusalem
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  ollama_data:
  n8n_data:
